<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>三谋三废盟 - 消除游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }
        /* 通用圆角正方形UI */
        .btn, .icon-item, .time-btn, .popup-btn {
            border-radius: 4px; /* 小圆润弧度 */
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn:hover, .time-btn:hover, .popup-btn:hover {
            opacity: 0.8;
            transform: scale(1.05);
        }
        /* 界面通用隐藏/显示 */
        .page {
            display: none;
            width: 100%;
            max-width: 450px;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .page.active {
            display: flex;
        }
        /* 界面1 - 主页 */
        #home .num-91 {
            font-size: 80px;
            color: #ffd700;
            margin: 100px 0 80px;
            font-weight: bold;
        }
        #home .start-btn {
            width: 200px;
            height: 60px;
            background: #ffd700;
            color: #000;
            font-size: 24px;
            font-weight: bold;
        }
        /* 时间选择界面 */
        #timeSelect {
            gap: 20px;
            margin-top: 100px;
        }
        .time-btn {
            width: 100px;
            height: 100px;
            background: #333;
            color: #ffd700;
            font-size: 28px;
            font-weight: bold;
        }
        /* 开场图标介绍动画 */
        #intro {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.95);
            z-index: 100;
            gap: 40px;
        }
        #intro .intro-title {
            font-size: 32px;
            color: #ffd700;
            margin-top: 80px;
        }
        #intro .intro-icon {
            width: 120px;
            height: 120px;
            border-radius: 4px;
            object-fit: cover;
            animation: fade 3s ease-in-out;
        }
        @keyframes fade {
            0% {opacity: 0; transform: scale(0.8);}
            20% {opacity: 1; transform: scale(1.1);}
            80% {opacity: 1; transform: scale(1.1);}
            100% {opacity: 0; transform: scale(0.8);}
        }
        /* 游戏主界面 */
        #game {
            width: 100%;
            max-width: 450px;
        }
        .game-title {
            font-size: 32px;
            color: #ffd700;
            text-align: center;
            margin-bottom: 20px;
        }
        /* 状态栏 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #222;
            padding: 10px 20px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .status-item {
            font-size: 20px;
            font-weight: bold;
        }
        .status-item span {
            color: #ffd700;
        }
        /* 8×8游戏网格 */
        #gameGrid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
            background: #222;
            padding: 4px;
            border-radius: 4px;
            width: 100%;
            aspect-ratio: 1/1;
        }
        .icon-item {
            width: 100%;
            height: 100%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: grab;
        }
        .icon-item img {
            width: 80%;
            height: 80%;
            object-fit: cover;
            border-radius: 2px;
        }
        .icon-item.grabbing {
            cursor: grabbing;
            transform: scale(1.1);
            z-index: 10;
            box-shadow: 0 0 10px #ffd700;
        }
        .icon-item.fall {
            transition: transform 0.3s ease;
        }
        /* 底部控制按钮 */
        .control-bar {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            justify-content: center;
        }
        .control-btn {
            width: 120px;
            height: 50px;
            background: #ffd700;
            color: #000;
            font-size: 18px;
            font-weight: bold;
        }
        /* 暂停遮罩 */
        #pauseMask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.8);
            z-index: 90;
            flex-direction: column;
            gap: 30px;
            display: none;
        }
        #pauseMask .pause-title {
            font-size: 40px;
            color: #ffd700;
            margin-top: 200px;
        }
        /* 结束弹窗 */
        #endPopup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            flex-direction: column;
            gap: 25px;
            display: none;
            padding: 0 20px;
        }
        .end-title {
            font-size: 40px;
            color: #ffd700;
            margin-top: 100px;
        }
        .end-stat {
            font-size: 22px;
            color: #fff;
            text-align: center;
        }
        .end-stat span {
            color: #ffd700;
            font-weight: bold;
        }
        .end-icon-desc {
            font-size: 18px;
            color: #ccc;
            margin-top: 5px;
        }
        .popup-btn-group {
            display: flex;
            gap: 20px;
            margin-top: 30px;
        }
        .popup-btn {
            width: 150px;
            height: 60px;
            font-size: 20px;
            font-weight: bold;
        }
        .back-home {
            background: #333;
            color: #ffd700;
        }
        .restart-game {
            background: #ffd700;
            color: #000;
        }
        /* 适配小屏幕 */
        @media (max-width: 400px) {
            .status-item {
                font-size: 16px;
            }
            .control-btn {
                width: 100px;
                height: 45px;
                font-size: 16px;
            }
            .end-title {
                font-size: 32px;
            }
            .end-stat {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- 音效：纯文件名，与HTML同目录 -->
    <audio id="bgm" src="音频编辑 1.mp3" loop style="display: none;">
    <audio id="eliminateSound" src="打地鼠.mp3" style="display: none;">

    <!-- 界面1：主页 -->
    <div id="home" class="page active">
        <div class="num-91">91</div>
        <button class="btn start-btn" onclick="toTimeSelect()">开始游戏</button>
    </div>

    <!-- 界面2：时间选择 -->
    <div id="timeSelect" class="page">
        <button class="time-btn" onclick="startGame(30)">30秒</button>
        <button class="time-btn" onclick="startGame(60)">60秒</button>
        <button class="time-btn" onclick="startGame(120)">120秒</button>
    </div>

    <!-- 开场图标介绍动画 -->
    <div id="intro" class="page" style="display: none;">
        <div class="intro-title">图标介绍</div>
        <img id="introIcon" class="intro-icon" src="" alt="图标">
    </div>

    <!-- 游戏主界面 -->
    <div id="game" class="page">
        <div class="game-title">三谋三废盟</div>
        <!-- 状态栏 -->
        <div class="status-bar">
            <div class="status-item">分数：<span id="score">0</span></div>
            <div class="status-item">时间：<span id="countdown">0</span>s</div>
        </div>
        <!-- 8×8游戏网格 -->
        <div id="gameGrid"></div>
        <!-- 底部控制 -->
        <div class="control-bar">
            <button class="btn control-btn" onclick="pauseGame()">暂停</button>
            <button class="btn control-btn" onclick="restartGame()">重新开始</button>
        </div>
    </div>

    <!-- 暂停遮罩 -->
    <div id="pauseMask">
        <div class="pause-title">游戏暂停</div>
        <button class="btn control-btn" onclick="resumeGame()">继续游戏</button>
        <button class="btn control-btn" onclick="restartGame()">重新开始</button>
    </div>

    <!-- 结束弹窗 -->
    <div id="endPopup">
        <div class="end-title">游戏结束！</div>
        <div class="end-stat">总消除次数：<span id="totalEliminate">0</span></div>
        <div class="end-stat">消除最多：<span id="maxIconName"></span></div>
        <div class="end-icon-desc" id="maxIconDesc"></div>
        <div class="end-stat"><span id="maxIconCount"></span>次（占比<span id="maxIconRate"></span>%）</div>
        <div class="popup-btn-group">
            <button class="popup-btn back-home" onclick="backHome()">返回主页</button>
            <button class="popup-btn restart-game" onclick="restartGame()">重新游戏</button>
        </div>
    </div>

    <script>
        // 全局配置：图标为纯文件名，与HTML同目录
        const ICONS = [
            {name: "后宫", src: "Screenshot_20260206_180228_edit_350532787241698", desc: "武勋仔"},
            {name: "天府", src: "Screenshot_20260206_180235_edit_350589870022040", desc: "村野匹夫"},
            {name: "云水楼", src: "Screenshot_20260206_180203_edit_350617019664426", desc: "唐氏儿"}
        ];
        // 游戏常量
        const ROWS = 8;
        const COLS = 8;
        // 游戏状态
        let gameState = {
            time: 120, // 游戏时长
            remainingTime: 120,
            score: 0,
            combo: 0, // 连击数
            eliminateCount: [0,0,0], // 三个图标各自消除次数
            totalEliminate: 0,
            isPlaying: false,
            isPaused: false,
            timer: null,
            selected: null, // 选中的图标元素
            grid: [] // 8x8网格数据，存储图标索引[0,1,2]
        };
        // 音效元素
        const bgm = document.getElementById("bgm");
        const eliminateSound = document.getElementById("eliminateSound");
        // 页面元素
        const homePage = document.getElementById("home");
        const timeSelectPage = document.getElementById("timeSelect");
        const introPage = document.getElementById("intro");
        const gamePage = document.getElementById("game");
        const gameGrid = document.getElementById("gameGrid");
        const scoreEl = document.getElementById("score");
        const countdownEl = document.getElementById("countdown");
        const pauseMask = document.getElementById("pauseMask");
        const endPopup = document.getElementById("endPopup");
        const introIcon = document.getElementById("introIcon");

        // 初始化页面
        window.onload = function() {
            // 解决浏览器音频自动播放限制：首次点击后播放背景音乐
            document.addEventListener("click", () => {
                bgm.play().catch(err => {});
            }, {once: true});
        };

        // 界面切换：显示指定页面，隐藏其他
        function showPage(pageId) {
            const pages = document.querySelectorAll(".page");
            pages.forEach(page => page.classList.remove("active"));
            document.getElementById(pageId).classList.add("active");
        }

        // 主页→时间选择
        function toTimeSelect() {
            showPage("timeSelect");
            bgm.play().catch(err => {}); // 尝试播放背景音乐
        }

        // 选择时长后开始游戏：先显示开场动画
        function startGame(time) {
            gameState.time = time;
            gameState.remainingTime = time;
            showPage("intro");
            introPage.style.display = "flex";
            // 开场图标动画：依次展示3个图标，总时长3秒
            let iconIndex = 0;
            introIcon.src = ICONS[iconIndex].src;
            const introTimer = setInterval(() => {
                iconIndex++;
                if (iconIndex >= ICONS.length) {
                    clearInterval(introTimer);
                    introPage.style.display = "none";
                    // 初始化游戏并显示游戏界面
                    initGame();
                    showPage("game");
                } else {
                    introIcon.src = ICONS[iconIndex].src;
                }
            }, 1000);
        }

        // 初始化游戏核心逻辑
        function initGame() {
            // 重置游戏状态
            gameState.score = 0;
            gameState.combo = 0;
            gameState.eliminateCount = [0,0,0];
            gameState.totalEliminate = 0;
            gameState.isPlaying = true;
            gameState.isPaused = false;
            scoreEl.innerText = 0;
            countdownEl.innerText = gameState.remainingTime;
            // 生成随机8x8网格
            generateGrid();
            // 启动倒计时
            clearInterval(gameState.timer);
            gameState.timer = setInterval(() => {
                if (!gameState.isPaused) {
                    gameState.remainingTime--;
                    countdownEl.innerText = gameState.remainingTime;
                    // 时间到游戏结束
                    if (gameState.remainingTime <= 0) {
                        gameOver();
                    }
                }
            }, 1000);
        }

        // 生成8×8游戏网格（DOM+数据）
        function generateGrid() {
            gameGrid.innerHTML = "";
            gameState.grid = [];
            // 生成随机网格数据
            for (let i = 0; i < ROWS; i++) {
                gameState.grid[i] = [];
                for (let j = 0; j < COLS; j++) {
                    gameState.grid[i][j] = Math.floor(Math.random() * ICONS.length);
                }
            }
            // 避免初始就有可消除组合
            while (checkEliminate().hasEliminate) {
                reshuffleGrid();
            }
            // 渲染DOM
            for (let i = 0; i < ROWS; i++) {
                for (let j = 0; j < COLS; j++) {
                    createIconItem(i, j);
                }
            }
        }

        // 创建单个图标元素并绑定拖拽事件
        function createIconItem(row, col) {
            const iconIndex = gameState.grid[row][col];
            const item = document.createElement("div");
            item.className = "icon-item";
            item.dataset.row = row;
            item.dataset.col = col;
            item.innerHTML = `<img src="${ICONS[iconIndex].src}" alt="${ICONS[iconIndex].name}">`;
            // 拖拽事件
            item.addEventListener("mousedown", (e) => {
                if (!gameState.isPlaying || gameState.isPaused) return;
                gameState.selected = e.target.closest(".icon-item");
                gameState.selected.classList.add("grabbing");
            });
            document.addEventListener("mousemove", (e) => {
                if (!gameState.selected || gameState.isPaused) return;
                e.preventDefault();
            });
            document.addEventListener("mouseup", (e) => {
                if (!gameState.selected || gameState.isPaused) return;
                const target = e.target.closest(".icon-item");
                // 判断是否为相邻图标
                if (target && isAdjacent(gameState.selected, target)) {
                    swapIcon(gameState.selected, target);
                }
                // 取消选中
                gameState.selected.classList.remove("grabbing");
                gameState.selected = null;
            });
            // 触摸事件（适配移动端）
            item.addEventListener("touchstart", (e) => {
                if (!gameState.isPlaying || gameState.isPaused) return;
                gameState.selected = e.target.closest(".icon-item");
                gameState.selected.classList.add("grabbing");
            });
            document.addEventListener("touchmove", (e) => {
                if (!gameState.selected || gameState.isPaused) return;
                e.preventDefault();
            });
            document.addEventListener("touchend", (e) => {
                if (!gameState.selected || gameState.isPaused) return;
                const target = e.target.closest(".icon-item");
                if (target && isAdjacent(gameState.selected, target)) {
                    swapIcon(gameState.selected, target);
                }
                gameState.selected.classList.remove("grabbing");
                gameState.selected = null;
            });
            gameGrid.appendChild(item);
        }

        // 判断两个图标是否相邻（上下左右）
        function isAdjacent(item1, item2) {
            const r1 = parseInt(item1.dataset.row);
            const c1 = parseInt(item1.dataset.col);
            const r2 = parseInt(item2.dataset.row);
            const c2 = parseInt(item2.dataset.col);
            // 同行相邻列 或 同列相邻行
            return (r1 === r2 && Math.abs(c1 - c2) === 1) || (c1 === c2 && Math.abs(r1 - r2) === 1);
        }

        // 交换两个图标元素
        function swapIcon(item1, item2) {
            const r1 = parseInt(item1.dataset.row);
            const c1 = parseInt(item1.dataset.col);
            const r2 = parseInt(item2.dataset.row);
            const c2 = parseInt(item2.dataset.col);
            // 交换网格数据
            [gameState.grid[r1][c1], gameState.grid[r2][c2]] = [gameState.grid[r2][c2], gameState.grid[r1][c1]];
            // 交换DOM图片
            [item1.innerHTML, item2.innerHTML] = [item2.innerHTML, item1.innerHTML];
            // 检查是否触发消除
            const {hasEliminate, eliminatePos} = checkEliminate();
            if (!hasEliminate) {
                // 无效交换：复原
                setTimeout(() => {
                    [gameState.grid[r1][c1], gameState.grid[r2][c2]] = [gameState.grid[r2][c2], gameState.grid[r1][c1]];
                    [item1.innerHTML, item2.innerHTML] = [item2.innerHTML, item1.innerHTML];
                }, 200);
                gameState.combo = 0; // 重置连击
                return;
            }
            // 有效交换：处理消除
            handleEliminate(eliminatePos);
        }

        // 检查是否有可消除组合，返回{是否消除、消除位置数组}
        function checkEliminate() {
            const eliminatePos = new Set(); // 存储(row,col)字符串避免重复
            // 检查横向消除（一行中连续3个及以上）
            for (let i = 0; i < ROWS; i++) {
                for (let j = 0; j < COLS - 2; j++) {
                    const cur = gameState.grid[i][j];
                    if (cur === gameState.grid[i][j+1] && cur === gameState.grid[i][j+2]) {
                        eliminatePos.add(`${i},${j}`);
                        eliminatePos.add(`${i},${j+1}`);
                        eliminatePos.add(`${i},${j+2}`);
                        // 处理连续超过3个的情况
                        let k = j+3;
                        while (k < COLS && gameState.grid[i][k] === cur) {
                            eliminatePos.add(`${i},${k}`);
                            k++;
                        }
                    }
                }
            }
            // 检查纵向消除（一列中连续3个及以上）
            for (let j = 0; j < COLS; j++) {
                for (let i = 0; i < ROWS - 2; i++) {
                    const cur = gameState.grid[i][j];
                    if (cur === gameState.grid[i+1][j] && cur === gameState.grid[i+2][j]) {
                        eliminatePos.add(`${i},${j}`);
                        eliminatePos.add(`${i+1},${j}`);
                        eliminatePos.add(`${i+2},${j}`);
                        // 处理连续超过3个的情况
                        let k = i+3;
                        while (k < ROWS && gameState.grid[k][j] === cur) {
                            eliminatePos.add(`${k},${j}`);
                            k++;
                        }
                    }
                }
            }
            return {
                hasEliminate: eliminatePos.size > 0,
                eliminatePos: Array.from(eliminatePos).map(pos => pos.split(",").map(Number))
            };
        }

        // 处理消除逻辑
        function handleEliminate(eliminatePos) {
            if (!gameState.isPlaying) return;
            // 播放消除音效
            eliminateSound.currentTime = 0;
            eliminateSound.play().catch(err => {});
            // 统计消除次数
            let eliminateNum = 0;
            const countMap = [0,0,0];
            eliminatePos.forEach(([r,c]) => {
                const iconIndex = gameState.grid[r][c];
                countMap[iconIndex]++;
                eliminateNum++;
                gameState.grid[r][c] = -1; // 标记为空白
                // 隐藏消除的图标
                const item = document.querySelector(`[data-row="${r}"][data-col="${c}"]`);
                item.style.opacity = 0;
            });
            // 更新全局消除统计
            gameState.eliminateCount = gameState.eliminateCount.map((v,i) => v + countMap[i]);
            gameState.totalEliminate += eliminateNum;
            // 计算分数：基础10分/个 + 连击加分（连击数×5）
            gameState.combo++;
            const addScore = eliminateNum * 10 + gameState.combo * 5;
            gameState.score += addScore;
            scoreEl.innerText = gameState.score;
            // 延迟执行掉落填充（等待消除动画）
            setTimeout(() => {
                fallAndFill();
            }, 300);
        }

        // 图标掉落并填充空白，处理连锁消除
        function fallAndFill() {
            // 处理每一列的掉落：从下往上，把非空图标移到下方
            for (let j = 0; j < COLS; j++) {
                const col = [];
                // 收集非空图标
                for (let i = 0; i < ROWS; i++) {
                    if (gameState.grid[i][j] !== -1) {
                        col.push(gameState.grid[i][j]);
                    }
                }
                // 顶部补空，生成新图标
                const emptyNum = ROWS - col.length;
                for (let i = 0; i < emptyNum; i++) {
                    col.unshift(Math.floor(Math.random() * ICONS.length));
                }
                // 更新网格数据
                for (let i = 0; i < ROWS; i++) {
                    gameState.grid[i][j] = col[i];
                }
                // 渲染掉落动画
                for (let i = 0; i < ROWS; i++) {
                    const item = document.querySelector(`[data-row="${i}"][data-col="${j}"]`);
                    item.style.opacity = 1;
                    item.classList.add("fall");
                    item.style.transform = `translateY(${emptyNum * 50}px)`;
                    setTimeout(() => {
                        item.innerHTML = `<img src="${ICONS[gameState.grid[i][j]].src}" alt="">`;
                        item.style.transform = "translateY(0)";
                    }, 100);
                    setTimeout(() => {
                        item.classList.remove("fall");
                    }, 300);
                }
            }
            // 掉落完成后检查连锁消除
            setTimeout(() => {
                const {hasEliminate, eliminatePos} = checkEliminate();
                if (hasEliminate) {
                    handleEliminate(eliminatePos); // 递归处理连锁
                } else {
                    gameState.combo = 0; // 重置连击
                    // 检查是否有有效移动，无则洗牌
                    if (!hasValidMove()) {
                        reshuffleGrid();
                    }
                }
            }, 400);
        }

        // 检查是否有有效移动（可交换形成消除）
        function hasValidMove() {
            // 临时交换相邻图标，检查是否消除
            for (let i = 0; i < ROWS; i++) {
                for (let j = 0; j < COLS; j++) {
                    // 交换右侧
                    if (j < COLS - 1) {
                        [gameState.grid[i][j], gameState.grid[i][j+1]] = [gameState.grid[i][j+1], gameState.grid[i][j]];
                        if (checkEliminate().hasEliminate) {
                            [gameState.grid[i][j], gameState.grid[i][j+1]] = [gameState.grid[i][j+1], gameState.grid[i][j]];
                            return true;
                        }
                        [gameState.grid[i][j], gameState.grid[i][j+1]] = [gameState.grid[i][j+1], gameState.grid[i][j]];
                    }
                    // 交换下侧
                    if (i < ROWS - 1) {
                        [gameState.grid[i][j], gameState.grid[i+1][j]] = [gameState.grid[i+1][j], gameState.grid[i][j]];
                        if (checkEliminate().hasEliminate) {
                            [gameState.grid[i][j], gameState.grid[i+1][j]] = [gameState.grid[i+1][j], gameState.grid[i][j]];
                            return true;
                        }
                        [gameState.grid[i][j], gameState.grid[i+1][j]] = [gameState.grid[i+1][j], gameState.grid[i][j]];
                    }
                }
            }
            return false;
        }

        // 洗牌：重新生成网格并渲染
        function reshuffleGrid() {
            for (let i = 0; i < ROWS; i++) {
                for (let j = 0; j < COLS; j++) {
                    gameState.grid[i][j] = Math.floor(Math.random() * ICONS.length);
                }
            }
            // 避免洗牌后仍无有效移动
            while (checkEliminate().hasEliminate || !hasValidMove()) {
                for (let i = 0; i < ROWS; i++) {
                    for (let j = 0; j < COLS; j++) {
                        gameState.grid[i][j] = Math.floor(Math.random() * ICONS.length);
                    }
                }
            }
            // 渲染新网格
            gameGrid.innerHTML = "";
            for (let i = 0; i < ROWS; i++) {
                for (let j = 0; j < COLS; j++) {
                    createIconItem(i, j);
                }
            }
        }

        // 暂停游戏
        function pauseGame() {
            if (!gameState.isPlaying) return;
            gameState.isPaused = true;
            pauseMask.style.display = "flex";
            bgm.pause();
        }

        // 继续游戏
        function resumeGame() {
            gameState.isPaused = false;
            pauseMask.style.display = "none";
            bgm.play().catch(err => {});
        }

        // 重新开始游戏
        function restartGame() {
            pauseMask.style.display = "none";
            endPopup.style.display = "none";
            initGame();
        }

        // 游戏结束
        function gameOver() {
            gameState.isPlaying = false;
            clearInterval(gameState.timer);
            bgm.pause();
            // 计算统计数据
            showEndStat();
            // 显示结束弹窗
            endPopup.style.display = "flex";
        }

        // 显示游戏结束统计数据
        function showEndStat() {
            const total = gameState.totalEliminate;
            const maxCount = Math.max(...gameState.eliminateCount);
            const maxIndex = gameState.eliminateCount.indexOf(maxCount);
            const rate = total === 0 ? 0 : Math.round((maxCount / total) * 100);
            // 更新DOM
            document.getElementById("totalEliminate").innerText = total;
            document.getElementById("maxIconName").innerText = ICONS[maxIndex].name;
            document.getElementById("maxIconDesc").innerText = ICONS[maxIndex].desc;
            document.getElementById("maxIconCount").innerText = maxCount;
            document.getElementById("maxIconRate").innerText = rate;
        }

        // 返回主页
        function backHome() {
            clearInterval(gameState.timer);
            endPopup.style.display = "none";
            showPage("home");
            bgm.pause();
            gameState.isPlaying = false;
        }
    </script>
</body>
</html>
