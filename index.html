<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>打地鼠游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #f8f9fa;
        }

        /* 页面通用样式 */
        .page {
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .page.active {
            display: flex;
        }

        /* 按钮通用样式 */
        .btn {
            padding: 15px 40px;
            font-size: 24px;
            border: none;
            border-radius: 12px;
            background-color: #2563eb;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .btn:hover {
            background-color: #1d4ed8;
            transform: scale(1.05);
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* 主页样式 */
        .home-page .title {
            font-size: 120px;
            font-weight: bold;
            color: #dc2626;
            margin-bottom: 100px;
        }

        /* 难度选择页样式 */
        .difficulty-page h2 {
            font-size: 36px;
            margin-bottom: 60px;
            color: #1f2937;
        }

        .difficulty-btns {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 80%;
            max-width: 300px;
        }

        .difficulty-btn {
            width: 100%;
            padding: 20px;
            font-size: 28px;
        }

        /* 游戏页样式 */
        .game-page {
            justify-content: flex-start;
            padding-top: 30px;
        }

        .game-header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            font-size: 20px;
            font-weight: bold;
            color: #1f2937;
        }

        .grid {
            width: 90vw;
            max-width: 600px;
            height: 90vw;
            max-height: 600px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 15px;
        }

        .grid-item {
            background-color: #e5e7eb;
            border-radius: 15px;
            position: relative;
            overflow: hidden;
        }

        .mole {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            animation: popUp 0.2s ease-out;
            cursor: pointer;
        }

        @keyframes popUp {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* 结果弹窗样式 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: white;
            padding: 40px 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        .modal-content h2 {
            font-size: 32px;
            margin-bottom: 30px;
            color: #dc2626;
        }

        .result-item {
            margin-bottom: 25px;
            font-size: 20px;
            color: #1f2937;
        }

        .most-hit {
            padding: 20px;
            background-color: #f3f4f6;
            border-radius: 10px;
        }

        .most-hit #mostHitName {
            font-size: 24px;
            font-weight: bold;
            margin: 10px 0;
        }

        .subtitle {
            font-size: 16px;
            color: #4b5563;
            margin-bottom: 10px;
        }

        .modal-btns {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        .modal-btns .btn {
            font-size: 18px;
            padding: 12px 25px;
        }
    </style>
</head>
<body>
    <!-- 主页 -->
    <div class="page home-page active">
        <h1 class="title">91</h1>
        <button class="btn start-btn" id="startBtn">开始游戏</button>
    </div>

    <!-- 难度选择页 -->
    <div class="page difficulty-page">
        <h2>选择游戏时长</h2>
        <div class="difficulty-btns">
            <button class="btn difficulty-btn" data-time="30">30秒</button>
            <button class="btn difficulty-btn" data-time="60">60秒</button>
            <button class="btn difficulty-btn" data-time="120">120秒</button>
        </div>
    </div>

    <!-- 游戏页 -->
    <div class="page game-page">
        <div class="game-header">
            <div class="score">得分：<span id="score">0</span></div>
            <div class="time">剩余时间：<span id="time">0</span>秒</div>
        </div>
        <div class="grid" id="grid">
            <div class="grid-item" data-index="0"></div>
            <div class="grid-item" data-index="1"></div>
            <div class="grid-item" data-index="2"></div>
            <div class="grid-item" data-index="3"></div>
            <div class="grid-item" data-index="4"></div>
            <div class="grid-item" data-index="5"></div>
            <div class="grid-item" data-index="6"></div>
            <div class="grid-item" data-index="7"></div>
            <div class="grid-item" data-index="8"></div>
        </div>
    </div>

    <!-- 结果弹窗 -->
    <div class="modal" id="resultModal">
        <div class="modal-content">
            <h2>游戏结束</h2>
            <div class="result-item">
                <p>总击中次数：<span id="totalHit">0</span>次</p>
            </div>
            <div class="result-item most-hit">
                <p>被击中最多的目标</p>
                <p id="mostHitName">--</p>
                <p class="subtitle" id="mostHitDesc">--</p>
                <p>被击中：<span id="mostHitCount">0</span>次</p>
            </div>
            <div class="modal-btns">
                <button class="btn" id="homeBtn">回到主页</button>
                <button class="btn" id="restartBtn">重新游戏</button>
            </div>
        </div>
    </div>

    <!-- 音频元素 -->
    <audio id="bgm" loop>
        <source src="音频编辑1.mp3" type="audio/mpeg">
    
    <audio id="hitSound">
        <source src="打地鼠.mp3" type="audio/mpeg">
    

    <script>
        // 地鼠配置 严格按照您提供的信息设置
        const moleConfig = [
            {
                name: '后宫',
                src: 'Screenshot_20260206_180228_edit_350532787241698.jpg',
                desc: '武勋仔',
                count: 0
            },
            {
                name: '天府',
                src: 'Screenshot_20260206_180235_edit_350589870022040.jpg',
                desc: '村野匹夫',
                count: 0
            },
            {
                name: '云水楼',
                src: 'Screenshot_20260206_180203_edit_350617019664426.jpg',
                desc: '唐氏儿',
                count: 0
            }
        ];

        // DOM元素获取
        const homePage = document.querySelector('.home-page');
        const difficultyPage = document.querySelector('.difficulty-page');
        const gamePage = document.querySelector('.game-page');
        const resultModal = document.getElementById('resultModal');
        const startBtn = document.getElementById('startBtn');
        const difficultyBtns = document.querySelectorAll('.difficulty-btn');
        const homeBtn = document.getElementById('homeBtn');
        const restartBtn = document.getElementById('restartBtn');
        const gridItems = document.querySelectorAll('.grid-item');
        const scoreEl = document.getElementById('score');
        const timeEl = document.getElementById('time');
        const totalHitEl = document.getElementById('totalHit');
        const mostHitNameEl = document.getElementById('mostHitName');
        const mostHitDescEl = document.getElementById('mostHitDesc');
        const mostHitCountEl = document.getElementById('mostHitCount');
        const bgm = document.getElementById('bgm');
        const hitSound = document.getElementById('hitSound');

        // 游戏状态变量
        let gameTime = 0;
        let remainingTime = 0;
        let score = 0;
        let timer = null;
        let moleTimer = null;
        let activeMoles = 0;
        let isPlaying = false;

        // 页面切换函数
        function switchPage(fromPage, toPage) {
            fromPage.classList.remove('active');
            toPage.classList.add('active');
        }

        // 重置游戏状态
        function resetGame() {
            score = 0;
            activeMoles = 0;
            isPlaying = false;
            moleConfig.forEach(mole => mole.count = 0);
            gridItems.forEach(item => item.innerHTML = '');
            if (timer) clearInterval(timer);
            if (moleTimer) clearInterval(moleTimer);
            scoreEl.textContent = score;
            timeEl.textContent = gameTime;
        }

        // 地鼠点击处理
        function handleMoleClick(e, moleData) {
            if (!isPlaying) return;
            
            // 播放击中音效
            hitSound.currentTime = 0;
            hitSound.play().catch(err => console.log('音效播放失败', err));
            
            // 更新分数和计数
            score++;
            scoreEl.textContent = score;
            moleData.count++;
            
            // 移除地鼠
            e.target.remove();
            activeMoles--;
        }

        // 生成地鼠
        function spawnMole() {
            if (!isPlaying || activeMoles >= 3) return;
            
            // 获取空的格子
            const emptyItems = Array.from(gridItems).filter(item => item.children.length === 0);
            if (emptyItems.length === 0) return;
            
            // 随机选择格子和地鼠
            const randomItem = emptyItems[Math.floor(Math.random() * emptyItems.length)];
            const randomMole = moleConfig[Math.floor(Math.random() * moleConfig.length)];
            
            // 创建地鼠元素
            const moleImg = document.createElement('img');
            moleImg.src = randomMole.src;
            moleImg.alt = randomMole.name;
            moleImg.className = 'mole';
            moleImg.addEventListener('click', (e) => handleMoleClick(e, randomMole));
            
            // 添加到格子
            randomItem.appendChild(moleImg);
            activeMoles++;
        }

        // 游戏结束处理
        function endGame() {
            isPlaying = false;
            clearInterval(timer);
            clearInterval(moleTimer);
            bgm.pause();
            
            // 更新结果
            totalHitEl.textContent = score;
            
            // 计算击中最多的地鼠
            let mostHit = moleConfig[0];
            moleConfig.forEach(mole => {
                if (mole.count > mostHit.count) mostHit = mole;
            });
            
            // 渲染结果
            if (score === 0) {
                mostHitNameEl.textContent = '无';
                mostHitDescEl.textContent = '你还未击中任何目标';
                mostHitCountEl.textContent = '0';
            } else {
                mostHitNameEl.textContent = mostHit.name;
                mostHitDescEl.textContent = mostHit.desc;
                mostHitCountEl.textContent = mostHit.count;
            }
            
            // 显示弹窗
            resultModal.classList.add('active');
        }

        // 开始游戏
        function startGame(time) {
            gameTime = time;
            remainingTime = time;
            
            // 重置游戏
            resetGame();
            
            // 切换页面
            switchPage(difficultyPage, gamePage);
            
            // 播放背景音乐
            bgm.currentTime = 0;
            bgm.play().catch(err => console.log('背景音乐播放失败', err));
            
            // 启动游戏
            isPlaying = true;
            spawnMole(); // 开局先生成1个
            moleTimer = setInterval(spawnMole, 1000); // 每秒刷新1个
            
            // 启动倒计时
            timer = setInterval(() => {
                remainingTime--;
                timeEl.textContent = remainingTime;
                if (remainingTime <= 0) endGame();
            }, 1000);
        }

        // 事件绑定
        startBtn.addEventListener('click', () => switchPage(homePage, difficultyPage));
        
        difficultyBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const time = parseInt(btn.dataset.time);
                startGame(time);
            });
        });
        
        homeBtn.addEventListener('click', () => {
            resultModal.classList.remove('active');
            switchPage(gamePage, homePage);
            resetGame();
        });
        
        restartBtn.addEventListener('click', () => {
            resultModal.classList.remove('active');
            startGame(gameTime);
        });
    </script>
</body>
</html>
