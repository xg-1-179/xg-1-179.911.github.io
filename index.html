<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>三谋三废盟 - 消除游戏</title>
    <style>
        :root {
            --main-yellow: #ffd700;
            --bg-black: #000000;
            --bg-dark: #222222;
            --bg-gray: #333333;
            --text-white: #ffffff;
            --text-gray: #cccccc;
            --radius-sm: 4px;
            --shadow-yellow: 0 0 10px var(--main-yellow);
            --transition: all 0.2s ease;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: var(--bg-black);
            color: var(--text-white);
            overflow: hidden;
        }
        #app {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            max-width: 480px;
            margin: 0 auto;
        }
        .page {
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .page--active {
            display: flex !important;
        }
        .btn {
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            background: var(--main-yellow);
            color: var(--bg-black);
            font-weight: 700;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn:hover {
            opacity: 0.9;
            transform: scale(1.05);
            box-shadow: var(--shadow-yellow);
        }
        .btn--dark {
            background: var(--bg-gray);
            color: var(--main-yellow);
        }
        .btn--lg {
            width: 200px;
            height: 60px;
            font-size: 24px;
        }
        .btn--md {
            width: 120px;
            height: 50px;
            font-size: 18px;
        }
        .btn--sm {
            width: 100px;
            height: 100px;
            font-size: 28px;
        }
        .btn--popup {
            width: 150px;
            height: 60px;
            font-size: 20px;
        }
        .home-page .num-91 {
            font-size: 80px;
            color: var(--main-yellow);
            font-weight: 700;
            margin-bottom: 80px;
            text-shadow: var(--shadow-yellow);
        }
        .time-page {
            gap: 20px;
        }
        .intro-page {
            gap: 40px;
        }
        .intro-page .intro-title {
            font-size: 32px;
            color: var(--main-yellow);
            font-weight: 700;
        }
        .intro-page .intro-icon {
            width: 120px;
            height: 120px;
            border-radius: var(--radius-sm);
            object-fit: cover;
            animation: introFade 1s ease-in-out;
        }
        @keyframes introFade {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.1); }
        }
        .game-page {
            justify-content: flex-start;
            gap: 15px;
            padding-top: 10px;
        }
        .game-page .game-title {
            font-size: 32px;
            color: var(--main-yellow);
            font-weight: 700;
            text-shadow: var(--shadow-yellow);
        }
        .game-page .status-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-dark);
            border-radius: var(--radius-sm);
            padding: 10px 20px;
        }
        .game-page .status-item {
            font-size: 20px;
            font-weight: 700;
        }
        .game-page .status-item span {
            color: var(--main-yellow);
            margin-left: 5px;
        }
        .game-page #gameGrid {
            width: 100%;
            aspect-ratio: 1/1;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 4px;
            background: var(--bg-dark);
            border-radius: var(--radius-sm);
            padding: 4px;
        }
        .game-page .icon-item {
            width: 100%;
            height: 100%;
            background: var(--bg-gray);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            transition: var(--transition);
            position: relative;
        }
        .game-page .icon-item img {
            width: 80%;
            height: 80%;
            object-fit: cover;
            border-radius: 2px;
        }
        .game-page .icon-item--grabbing {
            cursor: grabbing;
            transform: scale(1.1);
            z-index: 10;
            box-shadow: var(--shadow-yellow);
        }
        .game-page .icon-item--fade {
            opacity: 0;
            transform: scale(0.9);
        }
        .game-page .icon-item--fall {
            transition: transform 0.3s ease;
        }
        .game-page .control-bar {
            display: flex;
            gap: 20px;
        }
        #pauseMask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            z-index: 99;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }
        #pauseMask .pause-title {
            font-size: 40px;
            color: var(--main-yellow);
            font-weight: 700;
        }
        #endPopup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            z-index: 99;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px;
            padding: 20px;
        }
        #endPopup .end-title {
            font-size: 40px;
            color: var(--main-yellow);
            font-weight: 700;
            text-shadow: var(--shadow-yellow);
        }
        #endPopup .end-stat {
            font-size: 22px;
            color: var(--text-white);
            text-align: center;
        }
        #endPopup .end-stat span {
            color: var(--main-yellow);
            font-weight: 700;
        }
        #endPopup .end-icon-desc {
            font-size: 18px;
            color: var(--text-gray);
            margin-top: 5px;
        }
        #endPopup .popup-btn-group {
            display: flex;
            gap: 20px;
        }
        @media (max-width: 420px) {
            .home-page .num-91 {
                font-size: 70px;
                margin-bottom: 60px;
            }
            .game-page .game-title {
                font-size: 28px;
            }
            .game-page .status-item {
                font-size: 18px;
            }
            .btn--sm {
                width: 90px;
                height: 90px;
                font-size: 24px;
            }
            .btn--md {
                width: 100px;
                height: 45px;
                font-size: 16px;
            }
            .btn--popup {
                width: 130px;
                height: 55px;
                font-size: 18px;
            }
            #endPopup .end-title {
                font-size: 32px;
            }
            #endPopup .end-stat {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- 主页：开始按钮添加唯一ID，用于JS绑定事件（核心修复） -->
        <div class="page home-page page--active" id="homePage">
            <div class="num-91">91</div>
            <button class="btn btn--lg" id="startBtn">开始游戏</button>
        </div>

        <!-- 时间选择页：按钮添加ID，兜底绑定 -->
        <div class="page time-page" id="timePage">
            <button class="btn btn--sm" id="time30">30秒</button>
            <button class="btn btn--sm" id="time60">60秒</button>
            <button class="btn btn--sm" id="time120">120秒</button>
        </div>

        <div class="page intro-page" id="introPage">
            <div class="intro-title">图标介绍</div>
            <img src="" alt="游戏图标" class="intro-icon" id="introIcon">
        </div>

        <div class="page game-page" id="gamePage">
            <div class="game-title">三谋三废盟</div>
            <div class="status-bar">
                <div class="status-item">分数：<span id="scoreNum">0</span></div>
                <div class="status-item">时间：<span id="timeNum">0</span>s</div>
            </div>
            <div id="gameGrid"></div>
            <div class="control-bar">
                <button class="btn btn--md" id="pauseBtn">暂停</button>
                <button class="btn btn--md" id="restartBtn">重新开始</button>
            </div>
        </div>
    </div>

    <div id="pauseMask">
        <div class="pause-title">游戏暂停</div>
        <button class="btn btn--md" id="resumeBtn">继续游戏</button>
        <button class="btn btn--md" id="restartMaskBtn">重新开始</button>
    </div>

    <div id="endPopup">
        <div class="end-title">游戏结束！</div>
        <div class="end-stat">总消除次数：<span id="totalElim">0</span></div>
        <div class="end-stat">消除最多：<span id="maxIconName">后宫</span></div>
        <div class="end-icon-desc" id="maxIconDesc">武勋仔</div>
        <div class="end-stat"><span id="maxIconCount">0</span>次（占比<span id="maxIconRate">0</span>%）</div>
        <div class="popup-btn-group">
            <button class="btn btn--popup btn--dark" id="backHomeBtn">返回主页</button>
            <button class="btn btn--popup" id="restartEndBtn">重新游戏</button>
        </div>
    </div>

    <audio id="bgmAudio" src="音频编辑 1.mp3" loop preload="auto">
    <audio id="elimAudio" src="打地鼠.mp3" preload="auto">

    <script>
        // 全局配置
        const ICON_CONFIG = [
            { name: '后宫', src: 'Screenshot_20260206_180228_edit_350532787241698.jpg', desc: '武勋仔' },
            { name: '天府', src: 'Screenshot_20260206_180235_edit_350589870022040.jpg', desc: '村野匹夫' },
            { name: '云水楼', src: 'Screenshot_20260206_180203_edit_350617019664426.jpg', desc: '唐氏儿' }
        ];
        const GAME_ROWS = 8;
        const GAME_COLS = 8;
        const BASE_SCORE = 10;
        const COMBO_SCORE = 5;

        // 游戏状态
        let gameState = {
            gameTime: 120,
            remainTime: 120,
            score: 0,
            combo: 0,
            iconElimCount: [0, 0, 0],
            totalElimCount: 0,
            isPlaying: false,
            isPaused: false,
            timer: null,
            selectedIcon: null,
            gameGrid: [],
        };

        // DOM元素（一次性获取，确保加载完成）
        const dom = {
            homePage: document.getElementById('homePage'),
            timePage: document.getElementById('timePage'),
            introPage: document.getElementById('introPage'),
            gamePage: document.getElementById('gamePage'),
            gameGrid: document.getElementById('gameGrid'),
            scoreNum: document.getElementById('scoreNum'),
            timeNum: document.getElementById('timeNum'),
            introIcon: document.getElementById('introIcon'),
            pauseMask: document.getElementById('pauseMask'),
            endPopup: document.getElementById('endPopup'),
            totalElim: document.getElementById('totalElim'),
            maxIconName: document.getElementById('maxIconName'),
            maxIconDesc: document.getElementById('maxIconDesc'),
            maxIconCount: document.getElementById('maxIconCount'),
            maxIconRate: document.getElementById('maxIconRate'),
            bgm: document.getElementById('bgmAudio'),
            elimSound: document.getElementById('elimAudio'),
            // 所有按钮ID（核心：通过ID绑定事件，替代内联onclick）
            startBtn: document.getElementById('startBtn'),
            time30: document.getElementById('time30'),
            time60: document.getElementById('time60'),
            time120: document.getElementById('time120'),
            pauseBtn: document.getElementById('pauseBtn'),
            restartBtn: document.getElementById('restartBtn'),
            resumeBtn: document.getElementById('resumeBtn'),
            restartMaskBtn: document.getElementById('restartMaskBtn'),
            backHomeBtn: document.getElementById('backHomeBtn'),
            restartEndBtn: document.getElementById('restartEndBtn')
        };

        // ============= 核心修复：页面加载完成后，批量绑定所有按钮事件 =============
        window.addEventListener('DOMContentLoaded', function() {
            // 确保所有DOM元素加载完毕再绑定，彻底解决点击失效
            bindAllEvents();
            // 强制激活主页
            switchPage('homePage', true);
            console.log('所有元素加载完成，事件绑定成功！');
        });

        // 批量绑定所有点击事件（游戏完整流程链）
        function bindAllEvents() {
            // 主页→时间选择页
            dom.startBtn.addEventListener('click', () => switchPage('timePage'));
            // 时间选择→开始游戏
            dom.time30.addEventListener('click', () => startGame(30));
            dom.time60.addEventListener('click', () => startGame(60));
            dom.time120.addEventListener('click', () => startGame(120));
            // 游戏控制：暂停/重新开始
            dom.pauseBtn.addEventListener('click', pauseGame);
            dom.restartBtn.addEventListener('click', restartGame);
            // 暂停遮罩：继续/重新开始
            dom.resumeBtn.addEventListener('click', resumeGame);
            dom.restartMaskBtn.addEventListener('click', restartGame);
            // 结束弹窗：返回主页/重新开始
            dom.backHomeBtn.addEventListener('click', () => {
                switchPage('homePage', true);
                dom.endPopup.style.display = 'none';
            });
            dom.restartEndBtn.addEventListener('click', restartGame);
            // 解决音频自动播放：首次点击页面播放BGM
            document.addEventListener('click', () => {
                dom.bgm.play().catch(err => console.log('BGM播放失败：', err));
            }, { once: true });
        }

        // 通用方法：页面切换
        function switchPage(pageId, force = false) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('page--active'));
            const targetPage = document.getElementById(pageId);
            if (targetPage) targetPage.classList.add('page--active');
            // 切主页强制暂停游戏
            if (force) {
                gameState.isPlaying = false;
                gameState.isPaused = false;
                clearInterval(gameState.timer);
                dom.pauseMask.style.display = 'none';
                dom.endPopup.style.display = 'none';
                dom.bgm.pause();
            }
        }

        // 播放音效
        function playSound(audio) {
            audio.currentTime = 0;
            audio.play().catch(err => console.log('音效播放失败：', err));
        }

        // ============= 游戏完整流程：开始游戏→图标介绍→初始化游戏 =============
        function startGame(time) {
            gameState.gameTime = time;
            gameState.remainTime = time;
            dom.timeNum.innerText = time;
            switchPage('introPage');
            // 图标介绍动画（3秒）
            let iconIndex = 0;
            dom.introIcon.src = ICON_CONFIG[iconIndex].src;
            const introTimer = setInterval(() => {
                iconIndex++;
                if (iconIndex >= ICON_CONFIG.length) {
                    clearInterval(introTimer);
                    initGame();
                    switchPage('gamePage');
                } else {
                    dom.introIcon.src = ICON_CONFIG[iconIndex].src;
                }
            }, 1000);
            dom.bgm.play();
        }

        // 初始化游戏
        function initGame() {
            gameState.score = 0;
            gameState.combo = 0;
            gameState.iconElimCount = [0, 0, 0];
            gameState.totalElimCount = 0;
            gameState.isPlaying = true;
            gameState.isPaused = false;
            gameState.selectedIcon = null;
            dom.scoreNum.innerText = 0;
            dom.timeNum.innerText = gameState.remainTime;
            generateGameGrid();
            // 启动倒计时
            clearInterval(gameState.timer);
            gameState.timer = setInterval(() => {
                if (!gameState.isPaused) {
                    gameState.remainTime--;
                    dom.timeNum.innerText = gameState.remainTime;
                    if (gameState.remainTime <= 0) gameOver();
                }
            }, 1000);
        }

        // 生成8x8网格
        function generateGameGrid() {
            dom.gameGrid.innerHTML = '';
            gameState.gameGrid = [];
            // 生成随机数据
            for (let i = 0; i < GAME_ROWS; i++) {
                gameState.gameGrid[i] = [];
                for (let j = 0; j < GAME_COLS; j++) {
                    gameState.gameGrid[i][j] = Math.floor(Math.random() * 3);
                }
            }
            // 避免初始可消除
            while (checkEliminate().hasElim) regenerateGridData();
            // 渲染DOM
            for (let i = 0; i < GAME_ROWS; i++) {
                for (let j = 0; j < GAME_COLS; j++) {
                    createIconItem(i, j);
                }
            }
        }

        // 重新生成网格数据
        function regenerateGridData() {
            for (let i = 0; i < GAME_ROWS; i++) {
                for (let j = 0; j < GAME_COLS; j++) {
                    gameState.gameGrid[i][j] = Math.floor(Math.random() * 3);
                }
            }
        }

        // 创建单个图标+绑定拖拽事件
        function createIconItem(row, col) {
            const iconType = gameState.gameGrid[row][col];
            const iconItem = document.createElement('div');
            iconItem.className = 'icon-item';
            iconItem.dataset.row = row;
            iconItem.dataset.col = col;
            iconItem.innerHTML = `<img src="${ICON_CONFIG[iconType].src}" alt="${ICON_CONFIG[iconType].name}">`;
            // 鼠标拖拽
            iconItem.addEventListener('mousedown', (e) => {
                if (!gameState.isPlaying || gameState.isPaused) return;
                gameState.selectedIcon = e.target.closest('.icon-item');
                gameState.selectedIcon.classList.add('icon-item--grabbing');
            });
            // 移动端触摸
            iconItem.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (!gameState.isPlaying || gameState.isPaused) return;
                gameState.selectedIcon = e.target.closest('.icon-item');
                gameState.selectedIcon.classList.add('icon-item--grabbing');
            });
            dom.gameGrid.appendChild(iconItem);
        }

        // 全局处理拖拽交换（鼠标+移动端）
        document.addEventListener('mouseup', handleIconSwap);
        document.addEventListener('touchend', (e) => {
            e.preventDefault();
            handleIconSwap(e);
        });

        // 图标交换逻辑
        function handleIconSwap(e) {
            if (!gameState.selectedIcon || !gameState.isPlaying || gameState.isPaused) {
                if (gameState.selectedIcon) gameState.selectedIcon.classList.remove('icon-item--grabbing');
                gameState.selectedIcon = null;
                return;
            }
            const targetIcon = e.target.closest('.icon-item');
            if (!targetIcon || gameState.selectedIcon === targetIcon) {
                gameState.selectedIcon.classList.remove('icon-item--grabbing');
                gameState.selectedIcon = null;
                return;
            }
            if (isAdjacent(gameState.selectedIcon, targetIcon)) {
                swapIcon(gameState.selectedIcon, targetIcon);
            } else {
                gameState.selectedIcon.classList.remove('icon-item--grabbing');
                gameState.selectedIcon = null;
            }
        }

        // 判断相邻
        function isAdjacent(a, b) {
            const aRow = Number(a.dataset.row);
            const aCol = Number(a.dataset.col);
            const bRow = Number(b.dataset.row);
            const bCol = Number(b.dataset.col);
            return (aRow === bRow && Math.abs(aCol - bCol) === 1) || (aCol === bCol && Math.abs(aRow - bRow) === 1);
        }

        // 交换图标
        function swapIcon(a, b) {
            const aRow = Number(a.dataset.row);
            const aCol = Number(a.dataset.col);
            const bRow = Number(b.dataset.row);
            const bCol = Number(b.dataset.col);
            // 交换数据
            [gameState.gameGrid[aRow][aCol], gameState.gameGrid[bRow][bCol]] = [gameState.gameGrid[bRow][bCol], gameState.gameGrid[aRow][aCol]];
            // 交换DOM
            [a.innerHTML, b.innerHTML] = [b.innerHTML, a.innerHTML];
            // 检查消除
            const elimResult = checkEliminate();
            if (!elimResult.hasElim) {
                setTimeout(() => {
                    [gameState.gameGrid[aRow][aCol], gameState.gameGrid[bRow][bCol]] = [gameState.gameGrid[bRow][bCol], gameState.gameGrid[aRow][aCol]];
                    [a.innerHTML, b.innerHTML] = [b.innerHTML, a.innerHTML];
                    a.classList.remove('icon-item--grabbing');
                    b.classList.remove('icon-item--grabbing');
                }, 200);
                gameState.combo = 0;
            } else {
                handleEliminate(elimResult.elimPos);
                a.classList.remove('icon-item--grabbing');
                b.classList.remove('icon-item--grabbing');
            }
            gameState.selectedIcon = null;
        }

        // 检查消除
        function checkEliminate() {
            const elimPosSet = new Set();
            // 横向
            for (let i = 0; i < GAME_ROWS; i++) {
                for (let j = 0; j < GAME_COLS - 2; j++) {
                    const curType = gameState.gameGrid[i][j];
                    if (curType === gameState.gameGrid[i][j+1] && curType === gameState.gameGrid[i][j+2]) {
                        elimPosSet.add(`${i},${j}`);
                        elimPosSet.add(`${i},${j+1}`);
                        elimPosSet.add(`${i},${j+2}`);
                        let k = j + 3;
                        while (k < GAME_COLS && gameState.gameGrid[i][k] === curType) {
                            elimPosSet.add(`${i},${k}`);
                            k++;
                        }
                    }
                }
            }
            // 纵向
            for (let j = 0; j < GAME_COLS; j++) {
                for (let i = 0; i < GAME_ROWS - 2; i++) {
                    const curType = gameState.gameGrid[i][j];
                    if (curType === gameState.gameGrid[i+1][j] && curType === gameState.gameGrid[i+2][j]) {
                        elimPosSet.add(`${i},${j}`);
                        elimPosSet.add(`${i+1},${j}`);
                        elimPosSet.add(`${i+2},${j}`);
                        let k = i + 3;
                        while (k < GAME_ROWS && gameState.gameGrid[k][j] === curType) {
                            elimPosSet.add(`${k},${j}`);
                            k++;
                        }
                    }
                }
            }
            const elimPosArr = Array.from(elimPosSet).map(pos => pos.split(',').map(Number));
            return { hasElim: elimPosArr.length > 0, elimPos: elimPosArr };
        }

        // 处理消除
        function handleEliminate(elimPos) {
            if (!gameState.isPlaying) return;
            playSound(dom.elimSound);
            const elimCountMap = [0, 0, 0];
            elimPos.forEach(([row, col]) => {
                const iconType = gameState.gameGrid[row][col];
                elimCountMap[iconType]++;
                gameState.gameGrid[row][col] = -1;
                const iconItem = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
                if (iconItem) iconItem.classList.add('icon-item--fade');
            });
            // 更新统计
            gameState.iconElimCount = gameState.iconElimCount.map((v, i) => v + elimCountMap[i]);
            gameState.totalElimCount += elimPos.length;
            // 计算分数
            gameState.combo++;
            const addScore = elimPos.length * BASE_SCORE + gameState.combo * COMBO_SCORE;
            gameState.score += addScore;
            dom.scoreNum.innerText = gameState.score;
            // 掉落填充
            setTimeout(fallAndFillGrid, 300);
        }

        // 掉落填充+连锁消除
        function fallAndFillGrid() {
            for (let j = 0; j < GAME_COLS; j++) {
                const colData = [];
                for (let i = 0; i < GAME_ROWS; i++) {
                    if (gameState.gameGrid[i][j] !== -1) colData.push(gameState.gameGrid[i][j]);
                }
                const emptyNum = GAME_ROWS - colData.length;
                for (let i = 0; i < emptyNum; i++) colData.unshift(Math.floor(Math.random() * 3));
                // 更新数据
                for (let i = 0; i < GAME_ROWS; i++) gameState.gameGrid[i][j] = colData[i];
                // 掉落动画
                for (let i = 0; i < GAME_ROWS; i++) {
                    const iconItem = document.querySelector(`[data-row="${i}"][data-col="${j}"]`);
                    if (iconItem) {
                        iconItem.classList.remove('icon-item--fade');
                        iconItem.classList.add('icon-item--fall');
                        iconItem.style.transform = `translateY(${emptyNum * 50}px)`;
                        setTimeout(() => {
                            const iconType = gameState.gameGrid[i][j];
                            iconItem.innerHTML = `<img src="${ICON_CONFIG[iconType].src}" alt="${ICON_CONFIG[iconType].name}">`;
                            iconItem.style.transform = 'translateY(0)';
                        }, 100);
                        setTimeout(() => iconItem.classList.remove('icon-item--fall'), 300);
                    }
                }
            }
            // 检查连锁消除
            setTimeout(() => {
                const elimResult = checkEliminate();
                if (elimResult.hasElim) {
                    handleEliminate(elimResult.elimPos);
                } else {
                    gameState.combo = 0;
                    if (!hasValidMove()) reshuffleGrid();
                }
            }, 400);
        }

        // 检查有效移动
        function hasValidMove() {
            for (let i = 0; i < GAME_ROWS; i++) {
                for (let j = 0; j < GAME_COLS; j++) {
                    // 交换右侧
                    if (j < GAME_COLS - 1) {
                        [gameState.gameGrid[i][j], gameState.gameGrid[i][j+1]] = [gameState.gameGrid[i][j+1], gameState.gameGrid[i][j]];
                        if (checkEliminate().hasElim) {
                            [gameState.gameGrid[i][j], gameState.gameGrid[i][j+1]] = [gameState.gameGrid[i][j+1], gameState.gameGrid[i][j]];
                            return true;
                        }
                        [gameState.gameGrid[i][j], gameState.gameGrid[i][j+1]] = [gameState.gameGrid[i][j+1], gameState.gameGrid[i][j]];
                    }
                    // 交换下侧
                    if (i < GAME_ROWS - 1) {
                        [gameState.gameGrid[i][j], gameState.gameGrid[i+1][j]] = [gameState.gameGrid[i+1][j], gameState.gameGrid[i][j]];
                        if (checkEliminate().hasElim) {
                            [gameState.gameGrid[i][j], gameState.gameGrid[i+1][j]] = [gameState.gameGrid[i+1][j], gameState.gameGrid[i][j]];
                            return true;
                        }
                        [gameState.gameGrid[i][j], gameState.gameGrid[i+1][j]] = [gameState.gameGrid[i+1][j], gameState.gameGrid[i][j]];
                    }
                }
            }
            return false;
        }

        // 洗牌
        function reshuffleGrid() {
            regenerateGridData();
            while (checkEliminate().hasElim || !hasValidMove()) regenerateGridData();
            dom.gameGrid.innerHTML = '';
            for (let i = 0; i < GAME_ROWS; i++) {
                for (let j = 0; j < GAME_COLS; j++) {
                    createIconItem(i, j);
                }
            }
        }

        // 暂停游戏
        function pauseGame() {
            if (!gameState.isPlaying || gameState.isPaused) return;
            gameState.isPaused = true;
            dom.pauseMask.style.display = 'flex';
            dom.bgm.pause();
        }

        // 继续游戏
        function resumeGame() {
            if (!gameState.isPlaying || !gameState.isPaused) return;
            gameState.isPaused = false;
            dom.pauseMask.style.display = 'none';
            dom.bgm.play();
        }

        // 重新开始游戏
        function restartGame() {
            gameState.isPaused = false;
            dom.pauseMask.style.display = 'none';
            dom.endPopup.style.display = 'none';
            initGame();
            dom.bgm.play();
        }

        // 游戏结束
        function gameOver() {
            gameState.isPlaying = false;
            clearInterval(gameState.timer);
            dom.bgm.pause();
            // 统计数据
            const total = gameState.totalElimCount;
            const maxCount = Math.max(...gameState.iconElimCount);
            const maxIndex = gameState.iconElimCount.indexOf(maxCount);
            const rate = total === 0 ? 0 : Math.round((maxCount / total) * 100);
            // 更新弹窗
            dom.totalElim.innerText = total;
            dom.maxIconName.innerText = ICON_CONFIG[maxIndex].name;
            dom.maxIconDesc.innerText = ICON_CONFIG[maxIndex].desc;
            dom.maxIconCount.innerText = maxCount;
            dom.maxIconRate.innerText = rate;
            dom.endPopup.style.display = 'flex';
        }
    </script>
</body>
</html>
